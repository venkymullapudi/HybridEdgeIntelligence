[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-edge"
version = "0.2.0"
description = "Hybrid edge intelligence: open-weight models at AWS edges, escalating to Claude only when a confidence gate says so."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
  # Upper bounds stop a new major release from changing a production image with
  # no code change; CI tests the oldest (Python 3.9) and newest (3.12) resolutions.
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "httpx>=0.27,<1",
  "anthropic>=0.75,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "boto3>=1.34,<2", "coverage>=7.4,<8", "packaging>=23"]

[project.scripts]
hybrid-edge = "hybrid_edge.server:main"
hybrid-edge-calibrate = "hybrid_edge.calibrate:main"
hybrid-edge-label = "hybrid_edge.label:main"

[tool.setuptools.packages.find]
include = ["hybrid_edge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test running this long is hung, not slow (the suite takes ~20 s): dump every
# thread's stack so the culprit is visible instead of a silent spin.
faulthandler_timeout = 120
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["hybrid_edge"]

[tool.coverage.report]
# Floor, not target: CI fails if branch coverage drops below this.
fail_under = 92

