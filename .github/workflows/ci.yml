name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 has both versions we test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      # Branch coverage with a floor (pyproject [tool.coverage.report] fail_under).
      - run: coverage run -m pytest -q
      - run: coverage report --skip-covered --show-missing

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t hybrid-edge-gateway:ci .
      # Building isn't enough: start the image and prove it serves, passes its own
      # HEALTHCHECK, and runs as the non-root user.
      - name: Smoke-test the image
        run: |
          docker run -d --name gw -p 8080:8080 \
            -e HEI_EDGE_BACKEND=mock -e HEI_CLOUD_PROVIDER=none -e HEI_EMIT_EMF=false \
            hybrid-edge-gateway:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw)
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$status" = healthy
          curl -sf localhost:8080/v1/infer -H 'content-type: application/json' \
            -d '{"prompt":"What is the capital of France?"}' | tee /dev/stderr | grep -q '"source":"edge"'
          curl -sfN localhost:8080/v1/infer/stream -H 'content-type: application/json' \
            -d '{"prompt":"hello"}' | grep -q '^event: done'
          test "$(docker exec gw id -u)" = 10001
      - name: Container logs
        if: failure()
        run: docker logs gw || true
