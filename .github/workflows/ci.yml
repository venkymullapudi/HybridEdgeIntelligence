name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code. Without this the token gets the repository's default
# scope, which can include write access.
permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 build; 24.04 has both versions we test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      # Branch coverage with a floor (pyproject [tool.coverage.report] fail_under).
      - run: coverage run -m pytest -q
      - run: coverage report --skip-covered --show-missing

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t hybrid-edge-gateway:ci .
      # Building isn't enough: start the image and prove it serves, passes its own
      # HEALTHCHECK, and runs as the non-root user.
      - name: Smoke-test the image
        run: |
          # File record sink at its default path: it must be writable by the non-root user.
          docker run -d --name gw -p 8080:8080 \
            -e HEI_EDGE_BACKEND=mock -e HEI_CLOUD_PROVIDER=none -e HEI_EMIT_EMF=false \
            -e HEI_RECORD_SINK=file \
            hybrid-edge-gateway:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw)
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$status" = healthy
          curl -sf localhost:8080/v1/infer -H 'content-type: application/json' \
            -d '{"prompt":"What is the capital of France?"}' | tee /dev/stderr | grep -q '"source":"edge"'
          curl -sfN localhost:8080/v1/infer/stream -H 'content-type: application/json' \
            -d '{"prompt":"hello"}' | grep -q '^event: done'
          test "$(docker exec gw id -u)" = 10001
          # A low-confidence prompt is an escalation, so it must produce a record.
          curl -sf localhost:8080/v1/infer -H 'content-type: application/json' \
            -d '{"prompt":"prove this hard theorem"}' > /dev/null
          sleep 3
          docker exec gw sh -c 'test -s data/escalations.jsonl && head -c 300 data/escalations.jsonl'
          docker exec gw python -c "import json; r=json.loads(open('data/escalations.jsonl').readline()); assert r['escalated'], r"
      # The ECS deployment runs the gateway read-only with every capability dropped:
      # prove the image works that way.
      - name: Smoke-test the image locked down
        run: |
          docker run -d --name gw-locked -p 8081:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 10001 \
            -e HEI_EDGE_BACKEND=mock -e HEI_CLOUD_PROVIDER=none -e HEI_EMIT_EMF=false -e HEI_RECORD_SINK=stdout \
            hybrid-edge-gateway:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw-locked)
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$status" = healthy
          curl -sf localhost:8081/v1/infer -H 'content-type: application/json' \
            -d '{"prompt":"prove this hard theorem"}' | grep -q '"escalated":true'
          ! docker exec gw-locked sh -c 'touch /app/probe' 2>/dev/null
      - name: Container logs
        if: failure()
        run: |
          docker logs gw || true
          docker logs gw-locked || true
